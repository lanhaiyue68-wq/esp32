name: Retry 小藍 build

# The Xcode 27 Mac runners were taken for hours (11-25: "job was not acquired by Runner"). Every 30 minutes, on a
# cheap Linux runner: if main's latest commit has no successful IPA build and none is queued or running, start one
# (小藍 only). Stops by itself once main's build succeeds. Independent of the computer that pushed.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the IPA build if main has none that worked
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          ok=$(gh run list -R "$REPO" --workflow ipa.yml --commit "$head" --limit 50 --json conclusion \
                 --jq '[.[] | select(.conclusion=="success")] | length')
          busy=$(gh run list -R "$REPO" --workflow ipa.yml --limit 50 --json status \
                   --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          echo "main=$head successful=$ok queued_or_running=$busy"
          if [ "$ok" = "0" ] && [ "$busy" = "0" ]; then
            gh workflow run ipa.yml -R "$REPO" --ref main -f app=xiaolan
            echo "started a new 小藍 build"
          fi
