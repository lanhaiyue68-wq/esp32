# Unsigned IPA on a GitHub macOS runner, for a team without a Mac: the same Release build the Mac made for
# build 14 (default bundle ID, no signing). Sign and install from Windows (AllInSign or a sideloading tool),
# entering the bundle ID used on the phone there. Publish an IPA only after device build and simulator tests pass.
name: Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Direct capture frame policy
        run: |
          policy="$RUNNER_TEMP/capture-policy"
          mkdir -p "$policy/Sources" "$policy/Tests"
          cp ../tools/direct-capture-tests/Package.swift "$policy/Package.swift"
          cp IPhoneAgent/Video/DirectFrameState.swift "$policy/Sources/"
          cp ../tools/direct-capture-tests/main.swift "$policy/Tests/DirectFrameTests.swift"
          swift test --package-path "$policy"
      - name: XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build (Release, device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project IPhoneAgent.xcodeproj -scheme IPhoneAgent -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build 2>&1 | tail -150
      - name: Package IPA
        run: |
          app=$(ls -d build-device/Build/Products/Release-iphoneos/*.app | head -1)
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")
          echo "app: $app, build $build"
          /usr/libexec/PlistBuddy -c 'Print UIBackgroundModes' "$app/Info.plist"
          # A guarded source file must not silently disappear under an older SDK.
          otool -L "$app/IPhoneAgent" | grep ScreenCaptureKit
          mkdir -p ipa/Payload && cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry "../IPhoneAgent-build${build}-unsigned.ipa" Payload)
          shasum -a 256 IPhoneAgent-build*-unsigned.ipa | tee ipa.sha256
      - name: Unit tests (simulator, unsigned)
        run: |
          set -o pipefail
          sim=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+[A-Za-z ]*\(' | head -1 | sed 's/ ($//')
          echo "simulator: $sim"
          status=0
          xcodebuild test -project IPhoneAgent.xcodeproj -scheme IPhoneAgent \
            -destination "platform=iOS Simulator,name=$sim" -destination-timeout 90 -derivedDataPath build-sim \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log || status=$?
          tail -40 test.log
          echo "---- failures (assertion lines kept even when the log is long)"
          grep -E "error: |Test Case .* failed|Failing tests:|^\s+[A-Za-z0-9]+Tests\.test" test.log | head -80 || true
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-unsigned-ipa
          path: |
            ios/IPhoneAgent-build*-unsigned.ipa
            ios/ipa.sha256
          retention-days: 7
      - name: Preserve failed test evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-log
          path: ios/test.log
          if-no-files-found: ignore
          retention-days: 1
