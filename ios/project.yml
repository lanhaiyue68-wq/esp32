name: IPhoneAgent
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    # The CI packages `xcodebuild build`, which never strips: build85 shipped 79k symbols, 62% of the 9.6 MB binary.
    Release:
      DEPLOYMENT_POSTPROCESSING: "YES"
      STRIP_INSTALLED_PRODUCT: "YES"
targets:
  IPhoneAgent:
    type: application
    platform: iOS
    sources:
      - IPhoneAgent
      - Shared
      - KeyboardShared
      - path: ../prompts  # the model prompts, bundled as a folder
        type: folder
        buildPhase: resources
    dependencies:
      - target: AgentActivity
        embed: true
      - target: LanAgentKeyboard
        embed: true
    info:
      path: IPhoneAgent/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false  # HTTPS only
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(IA_BUNDLE_ID)
            CFBundleURLSchemes: [iphoneagent]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Pilot talks to its USB board over Bluetooth to see the screen and move the pointer.
        NSLocalNetworkUsageDescription: Pilot receives the mirrored screen from its board, and talks to ChatTool and your knowledge base on your computer, over your Wi-Fi.
        # Build 121: a video's spoken words. XcodeGen writes Info.plist from here: a key added only there is lost, and
        # asking for speech recognition without it ends the app.
        NSSpeechRecognitionUsageDescription: Pilot turns what a video says into text (spoken words, 口播文案) when you ask it to.
        NSMicrophoneUsageDescription: Pilot plays a voice clip while WeChat records it (voice message test); it never records you.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true  # plain HTTP / WS to ChatTool and the knowledge server on the LAN
        UIBackgroundModes: [bluetooth-central, audio, screen-capture]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:  # shared run archives (Settings › Privacy › Export) open as imported runs
          - CFBundleTypeName: Pilot runs
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        # Optional build-time LLM preset from Config/Local.xcconfig (empty in the open-source build)
        IAPresetBaseURL: $(IA_PRESET_BASE_URL)
        IAPresetModel: $(IA_PRESET_MODEL)
        IAPresetKey: $(IA_PRESET_KEY)
        IAAppGroup: group.$(IA_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID)
        PRODUCT_NAME: IPhoneAgent
        TARGETED_DEVICE_FAMILY: "1"  # the target preset says iPhone + iPad; this is an iPhone tool
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Hotspot entitlement needs an Apple ID in Xcode; opt in via Local.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(IA_ENTITLEMENTS)
  AgentActivity:
    type: app-extension
    platform: iOS
    sources: [AgentActivity, Shared]
    info:
      path: AgentActivity/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        IAAppGroup: group.$(IA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).activity
        CODE_SIGN_ENTITLEMENTS: $(IA_WIDGET_ENTITLEMENTS)
        PRODUCT_NAME: AgentActivity
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SKIP_INSTALL: YES
  # Lan Agent's keyboard (specs/004 phase A): types text the app hands it over 127.0.0.1. No App Group: the app is
  # installed through 全能簽, whose re-signing does not carry one. Needs "Allow Full Access" for the local connection.
  LanAgentKeyboard:
    type: app-extension
    platform: iOS
    sources: [LanAgentKeyboard, KeyboardShared]
    info:
      path: LanAgentKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).keyboard
        PRODUCT_NAME: LanAgentKeyboard
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  IPhoneAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IPhoneAgentTests]
    dependencies:
      - target: IPhoneAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IPhoneAgent.app/IPhoneAgent"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  IPhoneAgent:
    build:
      targets:
        IPhoneAgent: all
        IPhoneAgentTests: [test]
    test:
      targets: [IPhoneAgentTests]
