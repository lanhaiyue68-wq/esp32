name: IPhoneAgent
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"  # the customer's rented iPad 9 stays on iPadOS 17.4; iOS 18-only parts are gated
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # 159: iPad too (the customer's iPad 9), full screen
  configs:
    # The CI packages `xcodebuild build`, which never strips: build85 shipped 79k symbols, 62% of the 9.6 MB binary.
    Release:
      DEPLOYMENT_POSTPROCESSING: "YES"
      STRIP_INSTALLED_PRODUCT: "YES"
targets:
  IPhoneAgent:
    type: application
    platform: iOS
    sources:
      - IPhoneAgent
      - Shared
      - KeyboardShared
      - path: ../prompts  # the model prompts, bundled as a folder
        type: folder
        buildPhase: resources
    dependencies:
      - target: AgentActivity
        embed: true
      - target: LanAgentKeyboard
        embed: true
    info:
      path: IPhoneAgent/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false  # HTTPS only
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(IA_BUNDLE_ID)
            CFBundleURLSchemes: [iphoneagent]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]  # the board mirrors portrait
        NSBluetoothAlwaysUsageDescription: Pilot talks to its USB board over Bluetooth to see the screen and move the pointer.
        NSLocalNetworkUsageDescription: Pilot receives the mirrored screen from its board, and talks to ChatTool and your knowledge base on your computer, over your Wi-Fi.
        # Build 121: a video's spoken words. XcodeGen writes Info.plist from here: a key added only there is lost, and
        # asking for speech recognition without it ends the app.
        NSSpeechRecognitionUsageDescription: Pilot turns what a video says into text (spoken words, 口播文案) when you ask it to.
        NSMicrophoneUsageDescription: Pilot plays a voice clip while WeChat records it (voice message test); it never records you.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true  # plain HTTP / WS to ChatTool and the knowledge server on the LAN
        UIBackgroundModes: [bluetooth-central, audio, screen-capture]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:  # shared run archives (Settings › Privacy › Export) open as imported runs
          - CFBundleTypeName: Pilot runs
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        # Optional build-time LLM preset from Config/Local.xcconfig (empty in the open-source build)
        IAPresetBaseURL: $(IA_PRESET_BASE_URL)
        IAPresetModel: $(IA_PRESET_MODEL)
        IAPresetKey: $(IA_PRESET_KEY)
        IAAppGroup: group.$(IA_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID)
        PRODUCT_NAME: IPhoneAgent
        TARGETED_DEVICE_FAMILY: "1,2"  # 159: native on iPad, full screen (not the scaled iPhone window)
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Hotspot entitlement needs an Apple ID in Xcode; opt in via Local.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(IA_ENTITLEMENTS)
  AgentActivity:
    type: app-extension
    platform: iOS
    sources: [AgentActivity, Shared]
    info:
      path: AgentActivity/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        IAAppGroup: group.$(IA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).activity
        CODE_SIGN_ENTITLEMENTS: $(IA_WIDGET_ENTITLEMENTS)
        PRODUCT_NAME: AgentActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SKIP_INSTALL: YES
  # Lan Agent's keyboard (specs/004 phase A): types text the app hands it over 127.0.0.1. No App Group: the app is
  # installed through 全能簽, whose re-signing does not carry one. Needs "Allow Full Access" for the local connection.
  LanAgentKeyboard:
    type: app-extension
    platform: iOS
    sources: [LanAgentKeyboard, KeyboardShared]
    info:
      path: LanAgentKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).keyboard
        PRODUCT_NAME: LanAgentKeyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # 小藍 iPad 版 (docs/xiaolan-ipad-port-plan.md): the same sources built as its own app, named 小藍, with its own
  # bundle id so it installs beside Pilot. XIAOLAN switches what differs. Native on iPad: fills the screen.
  XiaoLan:
    type: application
    platform: iOS
    sources:
      - path: IPhoneAgent
        excludes: [Info.plist]  # Pilot's own; 小藍's is XiaoLan/Info.plist (else two Info.plist land in the app)
      - Shared
      - KeyboardShared
      - path: ../prompts
        type: folder
        buildPhase: resources
    dependencies:
      - target: XiaoLanKeyboard
        embed: true
    info:
      path: XiaoLan/Info.plist
      properties:
        CFBundleDisplayName: 小藍
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(IA_BUNDLE_ID).xiaolan
            CFBundleURLSchemes: [xiaolan]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: 小藍通過藍牙連接開發板，用來看畫面、移動指標和發送語音。
        NSLocalNetworkUsageDescription: 小藍從開發板接收鏡像畫面，並連接你電腦或伺服器上的指令服務。
        NSSpeechRecognitionUsageDescription: 小藍在你要求時把影片裡說的話轉成文字。
        NSMicrophoneUsageDescription: 小藍不會錄你的聲音；語音由語音開發板送出。
        NSPhotoLibraryAddUsageDescription: 伺服器指令要發圖片、影片、二維碼或朋友圈時，小藍先把它存進相簿，再由你在微信裡選它。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [bluetooth-central, audio, screen-capture]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Pilot runs
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        IAPresetBaseURL: $(IA_PRESET_BASE_URL)
        IAPresetModel: $(IA_PRESET_MODEL)
        IAPresetKey: $(IA_PRESET_KEY)
        IAAppGroup: group.$(IA_BUNDLE_ID).xiaolan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).xiaolan
        PRODUCT_NAME: XiaoLan
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) XIAOLAN
        ASSETCATALOG_COMPILER_APPICON_NAME: XiaoLanIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_ENTITLEMENTS: $(IA_ENTITLEMENTS)
  XiaoLanKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: LanAgentKeyboard
        excludes: [Info.plist]  # Pilot keyboard's own; this one is XiaoLanKeyboard/Info.plist
      - KeyboardShared
    info:
      path: XiaoLanKeyboard/Info.plist
      properties:
        CFBundleDisplayName: 小藍
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).xiaolan.keyboard
        PRODUCT_NAME: XiaoLanKeyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  IPhoneAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IPhoneAgentTests]
    dependencies:
      - target: IPhoneAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IPhoneAgent.app/IPhoneAgent"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  IPhoneAgent:
    build:
      targets:
        IPhoneAgent: all
        IPhoneAgentTests: [test]
    test:
      targets: [IPhoneAgentTests]
  XiaoLan:
    build:
      targets:
        XiaoLan: all
